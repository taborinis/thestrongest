<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Товар — THESTRONGEST</title>
<meta name="description" content="Картка товару THESTRONGEST: екіпірування для пауерліфтингу.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/product.css">
<link rel="stylesheet" href="css/interactive.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<!-- шапка -->
<header><div class="bar">
<a class="logo" href="index.html">THE <b>STRONGEST</b></a>
<nav aria-label="Основна навігація"><a href="index.html" aria-current="page">Каталог</a><a href="poyasa.html">Пояси</a><a href="nakolinnyky.html">Наколінники</a><a href="getry.html">Гетри</a><a href="ekipiruvannya.html">Екіпірування</a><a href="delivery.html">Доставка</a><a href="admin.html">Адмінка</a></nav>
<a class="cartbtn" href="checkout.html">Кошик</a>
</div></header>
<main>
<a class="link back" href="index.html">← До каталогу</a>
<!-- товар: фото зліва, інфо справа -->
<div class="pdp" id="top" data-dynamic>
<div><div class="tile"><img class="v v0" src="" alt="" hidden></div></div>
<div>
<div class="brand"></div>
<h1>Завантаження товару…</h1>
<div class="price"></div>
<fieldset class="sizes" hidden><legend class="sr">Розмір</legend></fieldset>
<!-- підписка на наявність -->
<form class="notify" action="#notify" id="notify">
<label class="sr" for="n-mail">Ваш email</label>
<input class="f" id="n-mail" name="email" type="email" placeholder="Ваш email" required>
<button class="btn" type="submit">Сповістити про наявність</button>
</form>
<a class="btn lg buy" href="checkout.html" hidden>Купити</a>
</div>
</div>
<!-- відгуки -->
<div class="reviews" id="reviews">
<div>
<h2 class="rev-title">Відгуки покупців</h2>
<p class="mute">Відгуків ще немає. Поділіться першим досвідом.</p>
</div>
<form class="panel" action="#reviews" method="get">
<h3>Залиште свій відгук</h3>
<div class="stars" role="radiogroup" aria-label="Оцінка"><input type="radio" name="rate" id="r5" value="5" required><label for="r5" title="5 з 5"><span class="sr">5 з 5</span>★</label><input type="radio" name="rate" id="r4" value="4" required><label for="r4" title="4 з 5"><span class="sr">4 з 5</span>★</label><input type="radio" name="rate" id="r3" value="3" required><label for="r3" title="3 з 5"><span class="sr">3 з 5</span>★</label><input type="radio" name="rate" id="r2" value="2" required><label for="r2" title="2 з 5"><span class="sr">2 з 5</span>★</label><input type="radio" name="rate" id="r1" value="1" required><label for="r1" title="1 з 5"><span class="sr">1 з 5</span>★</label></div>
<div class="row2">
<label class="sr" for="r-h">Зріст, см</label><input class="f" id="r-h" name="height" type="number" min="100" max="230" placeholder="Зріст, см">
<label class="sr" for="r-w">Вага, кг</label><input class="f" id="r-w" name="weight" type="number" min="30" max="250" placeholder="Вага, кг">
<label class="sr" for="r-t">Обхват талії</label><input class="f" id="r-t" name="waist" type="number" min="40" max="200" placeholder="Обхват талії">
</div>
<label class="sr" for="r-text">Текст відгуку</label>
<textarea class="f" id="r-text" name="text" rows="4" minlength="3" required placeholder="Як сидить, чи підійшов розмір, як у залі"></textarea>
<button class="btn" type="submit">Надіслати відгук</button>
<p class="note">Відгук з’явиться після перевірки на спам.</p>
</form>
</div>
</main>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script src="js/forms.js"></script>
<script src="js/product.js"></script>
</body>
</html>
