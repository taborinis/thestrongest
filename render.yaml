# Render: New → Blueprint
services:
  - type: web
    name: thestrongest
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DB_FILE
        value: ./data/shop.db
